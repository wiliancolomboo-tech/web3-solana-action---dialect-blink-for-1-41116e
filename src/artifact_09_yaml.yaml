version: "3.9"

services:
  blink-action-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blink-action-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ENTERPRISE_DISCORD_WEBHOOK=https://discord.com/api/webhooks/your-enterprise-hook
      - RESEND_API_KEY=re_test_000000000000000000000000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3