[package]
name = "vault_blink"
version = "0.1.0"
description = "1-Click Liquid Staking Vault for Dialect Blinks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault_blink"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }